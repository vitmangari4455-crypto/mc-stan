<!doctype html>
<html>
<head>
<style>
table,th,td{
border:1px solid black;
border-collapse:collapse;
}
th,td{
padding:5px;
text-align:left;
}
</style>
</head>
<body>
<h2>table caption</h2>
<p>to add a caption to a table,use the caption tag.</p>
<table style="width:100%">
<caption>monthly savings</caption>
<tr>
<th>month</th>
<th>savings</th>
</tr>
<tr>
<td>january</td>
<td>$100</td>
</tr>
<tr>
<td>february</td>
<td>$50</td>
</tr>
</table>
</body>
</html>
